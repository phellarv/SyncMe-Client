[project]
name = "syncme-client"
version = "0.1.0"
description = "SyncMe Client"
authors = [
    {name = "AI", email = "ai@example.com"},
]
dependencies = [
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.0.0",
    "pathspec>=0.12.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
syncme-client = "client.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["client"]
